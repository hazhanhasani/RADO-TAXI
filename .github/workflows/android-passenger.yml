name: Android Passenger APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/passenger/**'
      - '.github/workflows/android-passenger.yml'

permissions:
  contents: read

concurrency:
  group: rado-passenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: apps/passenger
        run: |
          flutter create . \
            --platforms=android \
            --project-name=rado_passenger \
            --org=ir.rado.taxi

      - name: Configure Android permissions
        working-directory: apps/passenger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''

          if 'android.permission.INTERNET' not in text:
              text = text.replace(marker, permissions, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze
        working-directory: apps/passenger
        run: flutter analyze

      - name: Build release APK
        working-directory: apps/passenger
        env:
          NESHAN_MAP_KEY: ${{ secrets.NESHAN_MAP_KEY }}
          RADO_API_BASE_URL: ${{ vars.RADO_API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=NESHAN_MAP_KEY="$NESHAN_MAP_KEY" \
            --dart-define=RADO_API_BASE_URL="$RADO_API_BASE_URL"

      - name: Rename APK
        run: cp apps/passenger/build/app/outputs/flutter-apk/app-release.apk RADO-Passenger-v0.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RADO-Passenger-v0.2.0
          path: RADO-Passenger-v0.2.0.apk
          if-no-files-found: error
          retention-days: 14
