name: Android Passenger APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/passenger/**'
      - 'scripts/**'
      - '.github/workflows/android-passenger.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: rado-passenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch permanent signing credentials from cPanel
        id: credentials
        continue-on-error: true
        run: bash scripts/fetch_cpanel_ci_credentials.sh

      - name: cPanel bootstrap notice
        if: steps.credentials.outcome != 'success'
        run: echo 'RADO cPanel secure bootstrap is not active yet; signed Passenger build was skipped.'

      - name: Generate Android platform files
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          flutter create . --platforms=android --project-name=rado_passenger --org=ir.rado.taxi
          rm -f test/widget_test.dart

      - name: Configure Android runtime permissions
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''
          if 'android.permission.INTERNET' not in text: text=text.replace(marker,permissions,1)
          path.write_text(text)
          PY

      - name: Fetch official RADO passenger icon
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          mkdir -p assets/branding
          curl -fsSL https://rado-taxi.sbs/assets/branding/rado-passenger.png -o assets/branding/rado-passenger.png
          test -s assets/branding/rado-passenger.png

      - name: Install dependencies and apply icon
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure permanent release signing
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rado-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rado-release.keystore
          EOF
          python3 ../../scripts/configure_android_signing.py android/app/build.gradle.kts

      - name: Analyze
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: flutter analyze

      - name: Build permanently signed release APK
        if: steps.credentials.outcome == 'success'
        working-directory: apps/passenger
        run: |
          flutter build apk --release \
            --build-name=0.2.2 \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=NESHAN_MAP_KEY="$NESHAN_MAP_KEY" \
            --dart-define=RADO_API_BASE_URL="https://rado-taxi.sbs"

      - name: Rename APK
        if: steps.credentials.outcome == 'success'
        run: cp apps/passenger/build/app/outputs/flutter-apk/app-release.apk "RADO-Passenger-main-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        if: steps.credentials.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RADO-Passenger-main-${{ github.run_number }}
          path: RADO-Passenger-main-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
