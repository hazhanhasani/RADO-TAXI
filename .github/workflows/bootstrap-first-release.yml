name: Bootstrap First RADO Release

on:
  push:
    branches: [main]
    paths:
      - '.github/RADO_BOOTSTRAP_RELEASE'

permissions:
  contents: write

jobs:
  tag-first-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        run: |
          VERSION="$(tr -d '[:space:]' < .github/RADO_BOOTSTRAP_RELEASE)"
          test -n "$VERSION" || (echo 'Empty release version' && exit 1)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $VERSION"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create production tag once
        run: |
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          git config user.name "RADO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$TAG" -m "RADO production release $TAG"
          git push origin "$TAG"
