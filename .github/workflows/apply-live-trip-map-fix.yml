name: Apply Live Trip Map Fix

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/APPLY_LIVE_TRIP_MAP_FIX'

permissions:
  contents: write

concurrency:
  group: rado-live-trip-map-source-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply deterministic live tracking patch
        run: python3 scripts/apply_live_trip_map_fix.py
      - name: Validate patch shape
        run: |
          set -euo pipefail
          grep -q "updateMarkers(_mapMarkers())" apps/passenger/lib/runtime_passenger.dart
          grep -q "driver-route-live" apps/passenger/lib/runtime_passenger.dart
          grep -q "PassengerRealtimeApi" apps/passenger/lib/runtime_passenger.dart
          grep -q "Timer.periodic(const Duration(seconds: 3)" apps/passenger/lib/runtime_passenger.dart
          grep -q "RadoNotifications" apps/passenger/lib/runtime_passenger.dart
          grep -q "RadoNotifications" apps/driver/lib/advanced_driver.dart
          grep -q "Duration(seconds: 5)" apps/driver/lib/advanced_driver.dart
          grep -q "راننده سفر را پذیرفت" deploy/cpanel/api/v1/driver/offers/index.php
          grep -q "trip_completed" deploy/cpanel/api/v1/driver/trip/index.php
          grep -q "passenger_id,destination_lat" deploy/cpanel/rado-system/lib/platform.php
          dart format --output=none --set-exit-if-changed apps/passenger/lib/runtime_passenger.dart apps/passenger/lib/live_trip.dart apps/passenger/lib/app_notifications.dart apps/driver/lib/advanced_driver.dart apps/driver/lib/app_notifications.dart
          php -l deploy/cpanel/api/v1/driver/offers/index.php
          php -l deploy/cpanel/api/v1/driver/trip/index.php
          php -l deploy/cpanel/rado-system/lib/platform.php
          git diff --check
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/passenger/lib/runtime_passenger.dart apps/driver/lib/advanced_driver.dart deploy/cpanel/api/v1/driver/offers/index.php deploy/cpanel/api/v1/driver/trip/index.php deploy/cpanel/rado-system/lib/platform.php
          if git diff --cached --quiet; then
            echo "Live trip source already patched"
            exit 0
          fi
          git commit -m "fix(live-trip): persistent map overlays live driver ETA and notifications"
          git push origin HEAD:main
