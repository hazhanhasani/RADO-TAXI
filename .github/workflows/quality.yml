name: Quality
on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required project files
        run: |
          test -f README.md
          test -f backend/database/schema.sql
          test -f apps/passenger/pubspec.yaml
          test -f apps/driver/pubspec.yaml
          test -f deploy/cpanel/api/v1/trips/status/index.php
          test -f deploy/cpanel/api/v1/driver/session/index.php
          test -f deploy/cpanel/api/v1/driver/presence/index.php
          test -f deploy/cpanel/api/v1/driver/offers/index.php
          test -f deploy/cpanel/api/v1/driver/trip/index.php
          test -f deploy/cpanel/api/v1/driver/wallet/index.php

      - name: PHP syntax check
        run: |
          find deploy/cpanel -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate cPanel API core include depth
        run: |
          if grep -R "dirname(__DIR__, 5).*rado-system/lib/app.php" deploy/cpanel/api/v1; then
            echo "Invalid cPanel API include depth detected"
            exit 1
          fi
          grep -R "dirname(__DIR__, 4).*rado-system/lib/app.php" deploy/cpanel/api/v1/driver deploy/cpanel/api/v1/trips/status

      - name: Verify Tehran and Jalali calendar core
        run: |
          php -r "require 'deploy/cpanel/rado-system/lib/app.php'; if (date_default_timezone_get() !== 'Asia/Tehran') { fwrite(STDERR, 'timezone failed\n'); exit(1); } if (rado_jalali_date('2026-09-08 12:00:00', false) !== '1405/06/17') { fwrite(STDERR, 'jalali conversion failed: '.rado_jalali_date('2026-09-08 12:00:00', false).'\n'); exit(1); } echo rado_jalali_datetime('2026-09-08 12:00:00').PHP_EOL;"
