name: Quality
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required RADO platform files
        run: |
          test -f README.md
          test -f backend/database/schema.sql
          test -f apps/passenger/pubspec.yaml
          test -f apps/passenger/lib/advanced_passenger.dart
          test -f apps/passenger/lib/runtime_passenger.dart
          test -f apps/passenger/lib/platform_features.dart
          test -f apps/driver/pubspec.yaml
          test -f apps/driver/lib/advanced_driver.dart
          test -f apps/driver/lib/driver_platform.dart
          test -f deploy/cpanel/sql/migrations/040_platform.sql
          test -f deploy/cpanel/sql/migrations/041_operations.sql
          test -f deploy/cpanel/rado-system/lib/platform.php
          test -f deploy/cpanel/rado-system/lib/payments.php
          test -f deploy/cpanel/rado-system/lib/migrate.php
          test -f deploy/cpanel/rado-system/lib/tick.php
          test -f deploy/cpanel/rado-system/bin/rado-update-core.php
          test -f deploy/cpanel/bin/rado-migrate.php
          test -f deploy/cpanel/bin/rado-tick.php
          test -f deploy/cpanel/bin/rado-update.php
          test -f deploy/cpanel/admin/_ui.php
          test -f deploy/cpanel/admin/dashboard.php
          test -f deploy/cpanel/admin/trips.php
          test -f deploy/cpanel/admin/drivers.php
          test -f deploy/cpanel/admin/passengers.php
          test -f deploy/cpanel/admin/operations.php
          test -f deploy/cpanel/admin/finance.php
          test -f deploy/cpanel/admin/growth.php
          test -f deploy/cpanel/admin/support.php
          test -f deploy/cpanel/admin/reports.php
          test -f deploy/cpanel/admin/system.php
          test -f deploy/cpanel/admin/settings.php
          test -f deploy/cpanel/admin/platform.php
          test -f deploy/cpanel/admin/dispatch.php
          test -f deploy/cpanel/admin/live-map.php
          test -f deploy/cpanel/admin/export.php
          test -f deploy/cpanel/admin/maps.php
          test -f deploy/cpanel/api/v1/maps/config/index.php
          test -f deploy/cpanel/api/v1/maps/reverse/index.php
          test -f deploy/cpanel/api/v1/maps/search/index.php
          test -f deploy/cpanel/api/v1/maps/route/index.php
          test -f deploy/cpanel/api/v1/platform/index.php
          test -f deploy/cpanel/api/v1/trips/change/index.php
          test -f deploy/cpanel/api/v1/driver/documents/index.php
          test -f deploy/cpanel/api/v1/trips/status/index.php
          test -f deploy/cpanel/api/v1/driver/session/index.php
          test -f deploy/cpanel/api/v1/driver/presence/index.php
          test -f deploy/cpanel/api/v1/driver/offers/index.php
          test -f deploy/cpanel/api/v1/driver/trip/index.php
          test -f deploy/cpanel/api/v1/driver/wallet/index.php

      - name: PHP syntax check
        run: find deploy/cpanel -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate modular admin navigation
        run: |
          grep -q "/admin/dashboard.php" deploy/cpanel/admin/index.php
          grep -q "/admin/operations.php" deploy/cpanel/admin/_ui.php
          grep -q "/admin/settings.php" deploy/cpanel/admin/_ui.php
          grep -q "/admin/system.php" deploy/cpanel/admin/_ui.php
          grep -Fq ".nav{display:flex" deploy/cpanel/admin/_ui.php
          grep -Fq "overflow-x:auto" deploy/cpanel/admin/_ui.php
          grep -Fq "require __DIR__.'/_ui.php'" deploy/cpanel/admin/maps.php
          grep -Fq "require __DIR__.'/_ui.php'" deploy/cpanel/admin/live-map.php
          grep -Fq "require __DIR__.'/_ui.php'" deploy/cpanel/admin/settings.php
          grep -q "آخرین Release" deploy/cpanel/admin/system.php
          grep -q "در جستجوی راننده" deploy/cpanel/admin/operations.php

      - name: Shared-hosting updater guard
        run: |
          for f in deploy/cpanel/bin/rado-update.php deploy/cpanel/rado-system/bin/rado-update-core.php; do
            if grep -E '\b(exec|shell_exec|system|passthru|proc_open)\s*\(' "$f"; then
              echo "Updater must not depend on disabled shell functions on shared hosting: $f"
              exit 1
            fi
          done
          grep -q "rado-update-core.php" deploy/cpanel/bin/rado-update.php
          grep -q "rado_run_database_migrations" deploy/cpanel/rado-system/bin/rado-update-core.php
          grep -q "rado_run_platform_tick" deploy/cpanel/rado-system/bin/rado-update-core.php
          grep -q "function radoUpdaterNowIsoTehran" deploy/cpanel/rado-system/bin/rado-update-core.php
          grep -q "last_success_iso.*radoUpdaterNowIsoTehran" deploy/cpanel/rado-system/bin/rado-update-core.php
          if grep -q "rado_now_iso_tehran" deploy/cpanel/rado-system/bin/rado-update-core.php; then
            echo "Updater references undefined legacy timestamp function"
            exit 1
          fi
          grep -q "function rado_run_database_migrations" deploy/cpanel/rado-system/lib/migrate.php
          grep -q "function rado_run_platform_tick" deploy/cpanel/rado-system/lib/tick.php

      - name: Validate cPanel release package layout
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/rado-system/bin"
          cp -a deploy/cpanel/rado-system/. "$tmp/rado-system/"
          cp -a deploy/cpanel/bin/. "$tmp/rado-system/bin/"
          test -f "$tmp/rado-system/bin/rado-update-core.php"
          test -f "$tmp/rado-system/bin/rado-update.php"
          test -f "$tmp/rado-system/bin/rado-tick.php"
          test -f "$tmp/rado-system/bin/rado-migrate.php"
          test ! -d "$tmp/rado-system/bin/bin"
          rm -rf "$tmp"

      - name: Validate runtime Neshan architecture
        run: |
          grep -q "neshan_web_map_key" deploy/cpanel/setup.php
          grep -q "neshan_service_api_key" deploy/cpanel/setup.php
          grep -q "runtime_map_configured" deploy/cpanel/api/ci-credentials/index.php
          ! grep -q "NESHAN_MAP_KEY" scripts/fetch_cpanel_ci_credentials.sh
          grep -q "neshan_web_map_key" deploy/cpanel/admin/maps.php
          grep -q "neshan_service_api_key" deploy/cpanel/admin/maps.php
          grep -q "neshan_web_map_key_missing" deploy/cpanel/api/v1/maps/config/index.php
          grep -q "place_name" deploy/cpanel/api/v1/maps/reverse/index.php
          grep -q "split_configuration_ok" deploy/cpanel/api/health/index.php
          grep -q "/api/v1/maps/config/" apps/passenger/lib/runtime_passenger.dart
          grep -q "RuntimePassengerPage" apps/passenger/lib/main.dart

      - name: Validate dispatch v2 contract
        run: |
          grep -q "require_once dirname(__DIR__, 4) . '/rado-system/lib/platform.php'" deploy/cpanel/api/v1/driver/offers/index.php
          grep -q "rado_offer_waiting_trip_to_driver_v2" deploy/cpanel/api/v1/driver/offers/index.php
          grep -q "rado_reoffer_expired_to_driver_v2" deploy/cpanel/rado-system/lib/platform.php
          grep -q "dispatch.log" deploy/cpanel/rado-system/lib/platform.php
          grep -q "max(45" deploy/cpanel/rado-system/lib/platform.php

      - name: Validate cPanel API include depth
        run: |
          if grep -R "dirname(__DIR__, 5).*rado-system/lib/app.php" deploy/cpanel/api/v1; then
            echo "Invalid cPanel API include depth detected"
            exit 1
          fi
          grep -R "dirname(__DIR__, 4).*rado-system/lib/app.php" deploy/cpanel/api/v1/driver deploy/cpanel/api/v1/trips/status deploy/cpanel/api/v1/maps/search deploy/cpanel/api/v1/maps/config
          grep -R "dirname(__DIR__, 3).*rado-system/lib/app.php" deploy/cpanel/api/v1/platform deploy/cpanel/api/v1/trips/index.php

      - name: Verify Tehran and Jalali calendar core
        run: |
          php -r "require 'deploy/cpanel/rado-system/lib/app.php'; if (date_default_timezone_get() !== 'Asia/Tehran') exit(1); if (rado_jalali_date('2026-09-08 12:00:00', false) !== '1405/06/17') exit(1);"

      - name: Validate migration contracts
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS trip_preferences" deploy/cpanel/sql/migrations/040_platform.sql
          grep -q "CREATE TABLE IF NOT EXISTS driver_preferences" deploy/cpanel/sql/migrations/040_platform.sql
          grep -q "CREATE TABLE IF NOT EXISTS support_tickets" deploy/cpanel/sql/migrations/040_platform.sql
          grep -q "CREATE TABLE IF NOT EXISTS driver_online_daily" deploy/cpanel/sql/migrations/041_operations.sql
          grep -q "CREATE TABLE IF NOT EXISTS refunds" deploy/cpanel/sql/migrations/041_operations.sql

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create CI-only branding placeholders
        run: |
          for app in passenger driver; do
            mkdir -p "apps/$app/assets/branding"
            printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZfWQAAAAASUVORK5CYII=' | base64 -d > "apps/$app/assets/branding/rado-$app.png"
          done
      - name: Passenger analyze
        working-directory: apps/passenger
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Driver analyze
        working-directory: apps/driver
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
