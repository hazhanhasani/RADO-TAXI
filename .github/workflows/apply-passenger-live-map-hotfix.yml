name: Apply Passenger Live Map Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/RADO_PASSENGER_LIVE_HOTFIX'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply passenger map, live driver and notification fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('apps/passenger/lib/runtime_passenger.dart')
          s = p.read_text()

          s = replace_once(s,
          """        await _calculate();
      }
      await _syncMapOverlays();
    } catch (e) {""",
          """        await _calculate();
      }
      await _syncMapOverlays();
      if (_step == 1 && _destination == null && _origin != null) {
        await _revealOriginForDestinationSelection();
      }
    } catch (e) {""",
          'reveal origin after map selection')

          s = replace_once(s,
          """  Future<void> _calculate() async {""",
          """  Future<void> _revealOriginForDestinationSelection() async {
    final origin = _origin;
    if (!_mapReady || origin == null || _destination != null) return;
    try {
      await _map.ready.timeout(const Duration(seconds: 3));
      final zoom = await _map.getCurrentZoom();
      final targetZoom = zoom.clamp(15.0, 17.0).toDouble();
      // Keep the confirmed origin visible above the destination selector instead
      // of letting both pins occupy the exact same screen position.
      _map.moveToLocation(
        origin.latitude - .0016,
        origin.longitude,
        zoom: targetZoom,
      );
    } catch (_) {}
  }

  Future<void> _calculate() async {""",
          'insert origin reveal helper')

          s = replace_once(s,
          """      if (_mapReady) _map.moveToLocation(selected.lat, selected.lng, zoom: 16);
      await _syncMapOverlays();
    }
  }

  Future<void> _requestTrip() async {""",
          """      if (_mapReady) _map.moveToLocation(selected.lat, selected.lng, zoom: 16);
      await _syncMapOverlays();
      await _revealOriginForDestinationSelection();
    }
  }

  Future<void> _requestTrip() async {""",
          'reveal searched origin')

          s = replace_once(s,
          """      final visualLat =
          ((north + south) / 2) - max((north - south) * .18, .0007);
      final visualLng = (east + west) / 2;""",
          """      final cameraShift = min(
        max((north - south) * .32, .0021),
        .0060,
      );
      final visualLat = ((north + south) / 2) - cameraShift;
      final visualLng = (east + west) / 2;""",
          'booking card camera offset')

          s = replace_once(s,
          """      await _poll();
      _show('درخواست برای رانندگان نزدیک ارسال شد.');""",
          """      await _poll();
      try {
        await _notifications.show(
          title: 'درخواست سفر ثبت شد',
          body: 'درخواست شما برای رانندگان نزدیک RADO ارسال شد.',
          payload: trip.id,
        );
      } catch (_) {}
      _show('درخواست برای رانندگان نزدیک ارسال شد.');""",
          'passenger request notification')

          s = replace_once(s,
          """      if (oldStatus != fresh.status) await _notifyTripTransition(fresh);
      await _updateDriverRoute(fresh);""",
          """      if (oldStatus != fresh.status) {
        await _notifyTripTransition(fresh);
        if (['driver_assigned', 'driver_arriving', 'arrived', 'in_progress']
            .contains(fresh.status)) {
          unawaited(_fitLiveDriver(fresh));
        }
      }
      await _updateDriverRoute(fresh);""",
          'frame live driver on status change')

          s = replace_once(s,
          """        now.difference(_lastDriverRouteAt!).inSeconds < 15 &&""",
          """        now.difference(_lastDriverRouteAt!).inSeconds < 9 &&""",
          'live route refresh cadence')

          marker = """    } catch (_) {}
  }

  List<NeshanMarker> _mapMarkers() => ["""
          helper = """    } catch (_) {}
  }

  Future<void> _fitLiveDriver(RideTrip trip) async {
    final pos = _live?.driverPosition;
    if (!_mapReady || pos == null || trip.terminal) return;
    final target = trip.status == 'in_progress'
        ? trip.destination.point
        : trip.pickup.point;
    final north = max(pos.lat, target.latitude);
    final south = min(pos.lat, target.latitude);
    final east = max(pos.lng, target.longitude);
    final west = min(pos.lng, target.longitude);
    final latSpan = north - south;
    final lngSpan = east - west;
    try {
      await _map.ready.timeout(const Duration(seconds: 3));
      _map.fitBounds(
        north + max(latSpan * .46, .0018),
        south - max(latSpan * .46, .0018),
        east + max(lngSpan * .34, .0014),
        west - max(lngSpan * .34, .0014),
      );
      await Future<void>.delayed(const Duration(milliseconds: 140));
      final zoom = await _map.getCurrentZoom();
      final shift = min(max(latSpan * .28, .0016), .0045);
      _map.moveToLocation(
        ((north + south) / 2) - shift,
        (east + west) / 2,
        zoom: zoom,
      );
    } catch (_) {}
  }

  List<NeshanMarker> _mapMarkers() => ["""
          # This sequence exists more than once in the file; anchor it after the
          # driver route method by replacing the last occurrence before map markers.
          idx = s.find(marker, s.find('Future<void> _updateDriverRoute'))
          if idx < 0:
              raise SystemExit('insert live driver fit helper: anchor missing')
          s = s[:idx] + helper + s[idx+len(marker):]

          s = replace_once(s,
          """    if (_destination != null)
      NeshanCircle(
        id: 'destination-halo',
        center: _destination!,
        radius: 28,
        fillColor: Colors.red,
        fillOpacity: .10,
        strokeColor: Colors.red,
        strokeWidth: 2.5,
        strokeOpacity: .9,
      ),
  ];""",
          """    if (_destination != null)
      NeshanCircle(
        id: 'destination-halo',
        center: _destination!,
        radius: 28,
        fillColor: Colors.red,
        fillOpacity: .10,
        strokeColor: Colors.red,
        strokeWidth: 2.5,
        strokeOpacity: .9,
      ),
    if (_live?.driverPosition != null)
      NeshanCircle(
        id: 'live-driver-halo',
        center: _live!.driverPosition!.point,
        radius: 38,
        fillColor: _yellow,
        fillOpacity: .18,
        strokeColor: _yellow,
        strokeWidth: 3,
        strokeOpacity: .95,
      ),
  ];""",
          'driver live halo')

          s = replace_once(s,
          """        id: 'route-main',
        coordinates: _route!.points,
        color: _yellow,
        width: 5,
        opacity: 1,""",
          """        id: 'route-main',
        coordinates: _route!.points,
        color: const Color(0xFF1565C0),
        width: 6.5,
        opacity: 1,""",
          'blue neshan suggested route')

          s = replace_once(s,
          """        id: 'driver-route-live',
        coordinates: _driverRoute!.points,
        color: Colors.blue,
        width: 4.5,
        opacity: .95,""",
          """        id: 'driver-route-live',
        coordinates: _driverRoute!.points,
        color: _yellow,
        width: 5.5,
        opacity: 1,""",
          'driver live route styling')

          s = replace_once(s,
          """            Positioned(top: 12, left: 12, right: 12, child: _header()),
            Positioned(
              left: 12,""",
          """            Positioned(top: 12, left: 12, right: 12, child: _header()),
            if (_trip != null && _live?.driverPosition != null)
              Positioned(
                top: 94,
                left: 16,
                child: Material(
                  elevation: 7,
                  color: Colors.white,
                  shape: const CircleBorder(),
                  child: IconButton(
                    tooltip: 'نمایش راننده روی نقشه',
                    onPressed: () => _fitLiveDriver(_trip!),
                    icon: const Icon(Icons.my_location_rounded),
                  ),
                ),
              ),
            Positioned(
              left: 12,""",
          'live driver recenter button')

          s = replace_once(s,
          """              Row(
                children: [
                  Expanded(
                    child: _MiniCard(
                      'مسافت',
                      _route!.distanceLabel,
                      Icons.route_rounded,
                    ),
                  ),
                  const SizedBox(width: 8),
                  Expanded(
                    child: _MiniCard(
                      'زمان',
                      _route!.durationLabel,
                      Icons.schedule_rounded,
                    ),
                  ),
                ],
              ),
            ],""",
          """              Row(
                children: [
                  Expanded(
                    child: _MiniCard(
                      'مسافت',
                      _route!.distanceLabel,
                      Icons.route_rounded,
                    ),
                  ),
                  const SizedBox(width: 8),
                  Expanded(
                    child: _MiniCard(
                      'زمان',
                      _route!.durationLabel,
                      Icons.schedule_rounded,
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 5),
              const Row(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Icon(Icons.alt_route_rounded, size: 15, color: Color(0xFF1565C0)),
                  SizedBox(width: 5),
                  Flexible(
                    child: Text(
                      'مسیر پیشنهادی نشان با خط آبی روی نقشه نمایش داده شده است.',
                      style: TextStyle(fontSize: 10, color: Colors.black54),
                      textAlign: TextAlign.center,
                    ),
                  ),
                ],
              ),
            ],""",
          'route legend in booking card')

          eta_re = re.compile(r"  Widget _liveEtaCard\(RideTrip trip\) \{.*?\n  \}\n\n  Widget _trackingCard", re.S)
          eta_new = """  Widget _liveEtaCard(RideTrip trip) {
    final eta = _live?.eta;
    final route = _driverRoute;
    final minutes = _driverRouteEtaMinutes ?? eta?.minutes;
    final approaching = trip.status != 'in_progress';
    final title = approaching ? 'رسیدن راننده' : 'زمان تا مقصد';
    final value = trip.status == 'arrived'
        ? 'راننده رسیده است'
        : minutes == null
        ? 'در حال محاسبه مسیر زنده…'
        : 'حدود $minutes دقیقه';
    final distance = route?.distanceLabel ?? eta?.distanceLabel ?? 'مسیر زنده';
    return Container(
      width: double.infinity,
      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
      decoration: BoxDecoration(
        color: const Color(0xFFFFF5CC),
        borderRadius: BorderRadius.circular(16),
      ),
      child: Row(
        children: [
          const Icon(Icons.navigation_rounded, color: _black),
          const SizedBox(width: 9),
          Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  title,
                  style: const TextStyle(fontSize: 10, color: Colors.black54),
                ),
                Text(
                  value,
                  style: const TextStyle(
                    fontWeight: FontWeight.w900,
                    fontSize: 14,
                  ),
                ),
              ],
            ),
          ),
          Text(
            distance,
            style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w700),
          ),
        ],
      ),
    );
  }

  Widget _trackingCard"""
          s, count = eta_re.subn(eta_new, s, count=1)
          if count != 1:
              raise SystemExit(f'live ETA card: expected 1 match, got {count}')

          s = replace_once(s,
          """            if (_live?.eta != null && !trip.terminal) ...[""",
          """            if ((_live?.eta != null || _driverRoute != null) && !trip.terminal) ...[""",
          'show route based ETA')

          p.write_text(s)

          d = Path('apps/driver/lib/advanced_driver.dart')
          t = d.read_text()
          t = replace_once(t,
          """      _show(accept ? 'سفر پذیرفته شد.' : 'درخواست رد شد.');
      await _refresh();""",
          """      _show(accept ? 'سفر پذیرفته شد.' : 'درخواست رد شد.');
      if (accept && trip != null) {
        try {
          await _notifications.show(
            title: 'سفر پذیرفته شد',
            body: 'مسیر رسیدن به مسافر فعال شد.',
            payload: trip.id,
          );
        } catch (_) {}
      }
      await _refresh();""",
          'driver accepted notification')

          t = replace_once(t,
          """      } else if (action == 'start') {
        _show('سفر شروع شد.');
      }
      await _refresh(all: action == 'complete');""",
          """      } else if (action == 'start') {
        _show('سفر شروع شد.');
      }
      try {
        final notice = switch (action) {
          'arrived' => ('رسیدن به مبدا ثبت شد', 'مسافر از رسیدن شما باخبر شد.'),
          'start' => ('سفر شروع شد', 'مسیریابی به مقصد سفر فعال است.'),
          'complete' => ('سفر پایان یافت', 'پایان سفر با موفقیت ثبت شد.'),
          _ => null,
        };
        if (notice != null) {
          await _notifications.show(
            title: notice.$1,
            body: notice.$2,
            payload: trip.id,
          );
        }
      } catch (_) {}
      await _refresh(all: action == 'complete');""",
          'driver trip action notifications')
          d.write_text(t)

          a = Path('deploy/cpanel/admin/live-map.php')
          u = a.read_text()
          u = replace_once(u,
          """    map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:true}),'top-left');""",
          """    if(typeof maplibregl.NavigationControl==='function'){
      map.addControl(new maplibregl.NavigationControl({showCompass:true,showZoom:true}),'top-left');
    }""",
          'optional Neshan NavigationControl')
          a.write_text(u)
          PY

      - name: Verify hotfix source guards
        run: |
          grep -q "مسیر پیشنهادی نشان با خط آبی" apps/passenger/lib/runtime_passenger.dart
          grep -q "live-driver-halo" apps/passenger/lib/runtime_passenger.dart
          grep -q "_fitLiveDriver" apps/passenger/lib/runtime_passenger.dart
          grep -q "typeof maplibregl.NavigationControl==='function'" deploy/cpanel/admin/live-map.php
          grep -q "مسافر از رسیدن شما باخبر شد" apps/driver/lib/advanced_driver.dart
          ! grep -q "difference(_lastDriverRouteAt!).inSeconds < 15" apps/passenger/lib/runtime_passenger.dart
          git diff --check
          php -l deploy/cpanel/admin/live-map.php

      - name: Commit hotfix
        run: |
          git config user.name "RADO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/passenger/lib/runtime_passenger.dart apps/driver/lib/advanced_driver.dart deploy/cpanel/admin/live-map.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(live-trip): persist map pins route ETA and notifications"
          git push origin main
