name: Apply Passenger Live Map Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/RADO_PASSENGER_LIVE_HOTFIX'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix hotfix script for nullable Neshan zoom
        run: |
          sed -i "s/final zoom = await _map.getCurrentZoom();/final zoom = (await _map.getCurrentZoom()) ?? 16.0;/" scripts/apply_passenger_live_hotfix.py

      - name: Apply source hotfix
        run: python3 scripts/apply_passenger_live_hotfix.py

      - name: Verify source guards
        run: |
          grep -q "مسیر پیشنهادی نشان با خط آبی" apps/passenger/lib/runtime_passenger.dart
          grep -q "live-driver-halo" apps/passenger/lib/runtime_passenger.dart
          grep -q "_fitLiveDriver" apps/passenger/lib/runtime_passenger.dart
          grep -q "difference(_lastDriverRouteAt!).inSeconds < 9" apps/passenger/lib/runtime_passenger.dart
          grep -q "typeof maplibregl.NavigationControl==='function'" deploy/cpanel/admin/live-map.php
          grep -q "مسافر از رسیدن شما باخبر شد" apps/driver/lib/advanced_driver.dart
          git diff --check
          php -l deploy/cpanel/admin/live-map.php

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze passenger
        working-directory: apps/passenger
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Analyze driver
        working-directory: apps/driver
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit hotfix
        run: |
          git config user.name "RADO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_passenger_live_hotfix.py apps/passenger/lib/runtime_passenger.dart apps/driver/lib/advanced_driver.dart deploy/cpanel/admin/live-map.php
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(live-trip): persist map pins route ETA and notifications"
          git push origin main
