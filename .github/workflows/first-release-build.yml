name: RADO Production Release

on:
  push:
    branches: [main]
    paths:
      - '.github/RADO_VERSION'

permissions:
  contents: write
  id-token: write

concurrency:
  group: rado-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and validate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < .github/RADO_VERSION)"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version=sys.argv[1]
          m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', version)
          if not m:
              raise SystemExit('RADO_VERSION must be strict SemVer: X.Y.Z')
          major,minor,patch=map(int,m.groups())
          if minor >= 1000 or patch >= 1000:
              raise SystemExit('minor and patch must stay below 1000')
          code=major*1_000_000 + minor*1_000 + patch
          if code <= 0 or code > 2_100_000_000:
              raise SystemExit('Computed Android versionCode is out of range')
          print(f'BUILD_CODE={code}')
          with open('/tmp/rado-build-code','w') as f: f.write(str(code))
          PY

          LATEST="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_name','v0.0.0').lstrip('v'))" \
            || echo '0.0.0')"

          python3 - "$VERSION" "$LATEST" <<'PY'
          import sys
          def semver(v):
              return tuple(map(int,v.split('.')))
          target,latest=sys.argv[1:3]
          if semver(target) <= semver(latest):
              raise SystemExit(f'Release version {target} must be greater than latest published {latest}')
          print(f'Publishing {target}; latest is {latest}')
          PY

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$(cat /tmp/rado-build-code)" >> "$GITHUB_ENV"

      - name: Fetch permanent signing credentials from RADO cPanel
        run: bash scripts/fetch_cpanel_ci_credentials.sh

      - name: Fetch official RADO icons from cPanel
        run: |
          mkdir -p apps/passenger/assets/branding apps/driver/assets/branding dist/icons
          curl -fsSL https://rado-taxi.sbs/assets/branding/rado-passenger.png -o apps/passenger/assets/branding/rado-passenger.png
          curl -fsSL https://rado-taxi.sbs/assets/branding/rado-driver.png -o apps/driver/assets/branding/rado-driver.png
          cp apps/passenger/assets/branding/rado-passenger.png dist/icons/rado-passenger.png
          cp apps/driver/assets/branding/rado-driver.png dist/icons/rado-driver.png

      - name: Build Passenger APK
        working-directory: apps/passenger
        run: |
          flutter create . --platforms=android --project-name=rado_passenger --org=ir.rado.taxi
          rm -f test/widget_test.dart
          python3 ../../scripts/configure_android_branding.py android/app/src/main/AndroidManifest.xml "RADO"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''
          if 'android.permission.INTERNET' not in s: s=s.replace(marker,perms,1)
          p.write_text(s)
          PY
          flutter pub get
          dart run flutter_launcher_icons
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rado-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rado-release.keystore
          EOF
          python3 ../../scripts/configure_android_signing.py android/app/build.gradle.kts
          flutter analyze
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_CODE" \
            --dart-define=NESHAN_MAP_KEY="$NESHAN_MAP_KEY" \
            --dart-define=RADO_API_BASE_URL="https://rado-taxi.sbs"
          cp build/app/outputs/flutter-apk/app-release.apk "../../RADO-Passenger-v${VERSION}.apk"

      - name: Build Driver APK
        working-directory: apps/driver
        run: |
          flutter create . --platforms=android --project-name=rado_driver --org=ir.rado.taxi
          rm -f test/widget_test.dart
          python3 ../../scripts/configure_android_branding.py android/app/src/main/AndroidManifest.xml "RADO Driver"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''
          if 'android.permission.INTERNET' not in s: s=s.replace(marker,perms,1)
          p.write_text(s)
          PY
          flutter pub get
          dart run flutter_launcher_icons
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rado-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rado-release.keystore
          EOF
          python3 ../../scripts/configure_android_signing.py android/app/build.gradle.kts
          flutter analyze
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_CODE" \
            --dart-define=RADO_API_BASE_URL="https://rado-taxi.sbs"
          cp build/app/outputs/flutter-apk/app-release.apk "../../RADO-Driver-v${VERSION}.apk"

      - name: Build complete cPanel package
        run: |
          rm -rf dist/cpanel
          mkdir -p dist/cpanel/rado-system dist/cpanel/assets/branding
          cp deploy/cpanel/.htaccess dist/cpanel/.htaccess
          cp deploy/cpanel/index.php dist/cpanel/index.php
          cp deploy/cpanel/setup.php dist/cpanel/setup.php
          cp deploy/cpanel/INSTALL.txt dist/cpanel/INSTALL.txt
          cp -a deploy/cpanel/api dist/cpanel/api
          cp -a deploy/cpanel/admin dist/cpanel/admin
          cp -a deploy/cpanel/downloads dist/cpanel/downloads
          cp -a deploy/cpanel/sql dist/cpanel/sql
          cp -a deploy/cpanel/rado-system/. dist/cpanel/rado-system/
          cp deploy/cpanel/config.php dist/cpanel/rado-system/config.php
          cp -a deploy/cpanel/bin dist/cpanel/rado-system/bin
          cp dist/icons/rado-passenger.png dist/cpanel/assets/branding/rado-passenger.png
          cp dist/icons/rado-driver.png dist/cpanel/assets/branding/rado-driver.png
          test -f dist/cpanel/admin/index.php
          test -f dist/cpanel/api/v1/fare/estimate/index.php
          test -f dist/cpanel/api/v1/trips/index.php
          test -f dist/cpanel/api/v1/trips/status/index.php
          test -f dist/cpanel/api/v1/driver/session/index.php
          test -f dist/cpanel/api/v1/driver/presence/index.php
          test -f dist/cpanel/api/v1/driver/offers/index.php
          test -f dist/cpanel/api/v1/driver/trip/index.php
          test -f dist/cpanel/api/v1/driver/wallet/index.php
          test -f dist/cpanel/rado-system/lib/app.php
          (cd dist/cpanel && zip -qr "../../RADO-cPanel-v${VERSION}.zip" .)

      - name: Generate release manifest and checksums
        run: |
          PASSENGER="RADO-Passenger-v${VERSION}.apk"
          DRIVER="RADO-Driver-v${VERSION}.apk"
          CPANEL="RADO-cPanel-v${VERSION}.zip"
          PASS_SHA=$(sha256sum "$PASSENGER" | awk '{print $1}')
          DRIVER_SHA=$(sha256sum "$DRIVER" | awk '{print $1}')
          CPANEL_SHA=$(sha256sum "$CPANEL" | awk '{print $1}')
          PUBLISHED_JALALI=$(php -r "require 'deploy/cpanel/rado-system/lib/app.php'; echo rado_jalali_datetime(null,true);")
          PUBLISHED_LONG=$(php -r "require 'deploy/cpanel/rado-system/lib/app.php'; echo rado_jalali_long();")
          export PUBLISHED_JALALI PUBLISHED_LONG
          python3 - <<PY
          import json, os
          version=os.environ['VERSION']; code=int(os.environ['BUILD_CODE'])
          data={
            'release':version,
            'published_at':os.environ['PUBLISHED_JALALI'],
            'published_at_long':os.environ['PUBLISHED_LONG'],
            'timezone':'Asia/Tehran',
            'calendar':'jalali',
            'apps':{
              'passenger':{'version':version,'version_code':code,'minimum_supported_code':1,'mandatory':False,'asset':f'RADO-Passenger-v{version}.apk','sha256':'$PASS_SHA'},
              'driver':{'version':version,'version_code':code,'minimum_supported_code':1,'mandatory':False,'asset':f'RADO-Driver-v{version}.apk','sha256':'$DRIVER_SHA'}
            },
            'cpanel':{'version':version,'asset':f'RADO-cPanel-v{version}.zip','sha256':'$CPANEL_SHA'}
          }
          open('RADO-release.json','w').write(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          sha256sum "$PASSENGER" "$DRIVER" "$CPANEL" RADO-release.json > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: RADO v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            RADO-Passenger-v${{ env.VERSION }}.apk
            RADO-Driver-v${{ env.VERSION }}.apk
            RADO-cPanel-v${{ env.VERSION }}.zip
            RADO-release.json
            SHA256SUMS.txt

      - name: Verify release is really published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v${VERSION}" \
            > /tmp/rado-release-published.json
          python3 - <<'PY'
          import json, os
          version=os.environ['VERSION']
          with open('/tmp/rado-release-published.json') as f:
              release=json.load(f)
          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('Release exists but is not a final published release')
          if release.get('tag_name') != f'v{version}':
              raise SystemExit('Published tag does not match requested version')
          assets={a['name']: int(a.get('size') or 0) for a in release.get('assets',[])}
          required={
              f'RADO-Passenger-v{version}.apk': 1_000_000,
              f'RADO-Driver-v{version}.apk': 1_000_000,
              f'RADO-cPanel-v{version}.zip': 10_000,
              'RADO-release.json': 100,
              'SHA256SUMS.txt': 100,
          }
          missing=[name for name in required if name not in assets]
          if missing:
              raise SystemExit('Published release is missing assets: '+', '.join(missing))
          tiny=[name for name,min_size in required.items() if assets[name] < min_size]
          if tiny:
              raise SystemExit('Published assets look incomplete: '+', '.join(tiny))
          print(f'RADO v{version} is a real final GitHub Release with all required assets.')
          PY
