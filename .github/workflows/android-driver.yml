name: Android Driver APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/driver/**'
      - 'scripts/configure_android_signing.py'
      - '.github/workflows/android-driver.yml'

permissions:
  contents: read

concurrency:
  group: rado-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing ANDROID_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing ANDROID_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing ANDROID_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing ANDROID_KEY_PASSWORD' && exit 1)

      - name: Generate Android platform files
        working-directory: apps/driver
        run: |
          flutter create . \
            --platforms=android \
            --project-name=rado_driver \
            --org=ir.rado.taxi
          rm -f test/widget_test.dart

      - name: Configure Android permissions
        working-directory: apps/driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'''
          if 'android.permission.INTERNET' not in text:
              text = text.replace(marker, permissions, 1)
          path.write_text(text)
          PY

      - name: Fetch official RADO driver icon
        working-directory: apps/driver
        run: |
          mkdir -p assets/branding
          if [ ! -f assets/branding/rado-driver.png ]; then
            curl --fail --silent --show-error --location \
              https://rado-taxi.sbs/assets/branding/rado-driver.png \
              --output assets/branding/rado-driver.png
          fi
          test -s assets/branding/rado-driver.png

      - name: Install dependencies and icon
        working-directory: apps/driver
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure permanent release signing
        working-directory: apps/driver
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rado-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rado-release.keystore
          EOF
          python3 ../../scripts/configure_android_signing.py android/app/build.gradle.kts

      - name: Analyze
        working-directory: apps/driver
        run: flutter analyze

      - name: Build permanently signed release APK
        working-directory: apps/driver
        run: flutter build apk --release

      - name: Rename APK
        run: cp apps/driver/build/app/outputs/flutter-apk/app-release.apk RADO-Driver-v0.2.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RADO-Driver-v0.2.1
          path: RADO-Driver-v0.2.1.apk
          if-no-files-found: error
          retention-days: 14
