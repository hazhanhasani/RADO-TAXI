name: rado_driver
description: RADO Driver app
publish_to: none
version: 0.6.5+6005

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  file_picker: ^10.1.9
  flutter_local_notifications: ^19.5.0
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  latlong2: ^0.10.1
  package_info_plus: ^8.1.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/rado-driver.png"
  adaptive_icon_background: "#171717"
  adaptive_icon_foreground: "assets/branding/rado-driver.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/rado-driver.png
