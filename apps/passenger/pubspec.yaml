name: rado_passenger
description: RADO Passenger - ride hailing app for Baneh
publish_to: none
version: 0.5.0+5000

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  geolocator: ^14.0.2
  latlong2: ^0.10.1
  neshan_maps_flutter: ^1.1.0
  package_info_plus: ^8.1.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/rado-passenger.png"
  adaptive_icon_background: "#171717"
  adaptive_icon_foreground: "assets/branding/rado-passenger.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/rado-passenger.png
